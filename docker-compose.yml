# cognee + Obsidian vault connector, no LLM key.
#
# Three services:
#   postgres  one Postgres holds all three cognee stores: relational, pgvector, postgres_demo graph
#   api       the published cognee image, answers /api/v1/search (recall) over the synced data
#   sync      same image + the Obsidian connector; runs remember() in the foreground, once or on an
#             interval, then materialises the wikilink edges (sync/link_edges.py)
#
# Both cognee containers share one Postgres and one model-cache volume, so a sync and a
# recall see the same data and the ~750 MB GLiNER model downloads once. The vault is mounted
# read-only into the sync container: the connector never writes to it.
#
#   python scripts/build_vault.py --source ../help/src/content/docs/en --out vault
#   docker compose up -d                 # bring the stack up (postgres + api)
#   docker compose run --rm sync         # run one sync
#   ./scripts/ask.sh "your question"     # ask a question

x-cognee-env: &cognee-env
  # --- no LLM key anywhere: cognee falls back to GLiNER (graph) + fastembed (embeddings)
  # LLM_API_KEY is intentionally unset.
  # --- one Postgres for all stores
  DB_PROVIDER: postgres
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: cognee
  DB_PASSWORD: ${POSTGRES_PASSWORD:-cognee}
  DB_NAME: cognee_db
  VECTOR_DB_PROVIDER: pgvector
  VECTOR_DB_URL: postgresql://cognee:${POSTGRES_PASSWORD:-cognee}@postgres:5432/cognee_db
  GRAPH_DATABASE_PROVIDER: postgres_demo
  GRAPH_DATABASE_URL: postgresql+asyncpg://cognee:${POSTGRES_PASSWORD:-cognee}@postgres:5432/cognee_db
  # --- single tenant: both processes act as the default user and see one dataset
  ENABLE_BACKEND_ACCESS_CONTROL: "false"
  # --- model caches on a shared named volume (owned by the image's uid 1000)
  HF_HOME: /cognee-storage/models/hf
  FASTEMBED_CACHE_PATH: /cognee-storage/models/fastembed
  # --- dlt pipeline working dir on the shared volume (state also lives in Postgres)
  DLT_DATA_DIR: /cognee-storage/dlt
  TOKENIZERS_PARALLELISM: "false"

services:
  postgres:
    # pgvector/pgvector:pg17 as pulled on 2026-10-05, pinned by digest
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    restart: unless-stopped
    environment:
      POSTGRES_USER: cognee
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cognee}
      POSTGRES_DB: cognee_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cognee -d cognee_db"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  api:
    # cognee/cognee:main as pulled on 2026-10-05 (cognee 1.6.2), pinned by digest
    image: cognee/cognee@sha256:b9c727a631222897f60de9d796190bbf0a33254afdb335a6638a2419dccc3101
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *cognee-env
    ports:
      - "8000:8000"
    volumes:
      - cognee_storage:/cognee-storage
    # /health is the image's own HEALTHCHECK; repeated here so `compose ps` shows it.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${API_MEM_LIMIT:-1g}

  sync:
    build: ./sync                 # same pinned cognee image + the connector at one commit (sync/Dockerfile)
    profiles: ["sync"]            # never starts with `up`; run explicitly (a job, so no restart policy)
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *cognee-env
      OBSIDIAN_VAULT_PATH: /vault
      COGNEE_DATASET: ${COGNEE_DATASET:-obsidian_vault}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-0}   # 0 = run once and exit
      SYNC_DATA_PER_BATCH: ${SYNC_DATA_PER_BATCH:-4}     # documents cognified at once
      SYNC_CHUNKS_PER_BATCH: ${SYNC_CHUNKS_PER_BATCH:-4} # chunks per GLiNER call; ~250 MiB each on top of a 2.7 GiB base
      SYNC_CHUNK_SIZE: ${SYNC_CHUNK_SIZE:-0}             # 0 = cognee's automatic chunk size
      SYNC_LINK_EDGES: ${SYNC_LINK_EDGES:-true}          # materialise links_to edges after remember()
      # Closed GLiNER schema (see ontology/help.owl for why). Unset to fall back to the label-bank probe.
      ONTOLOGY_FILE_PATH: ${ONTOLOGY_FILE_PATH:-/app/ontology/help.owl}
    volumes:
      - cognee_storage:/cognee-storage
      - ${VAULT_DIR:-./vault}:/vault:ro
      - ./ontology:/app/ontology:ro
    # Healthy = the last successful sync finished within 2x the interval.
    healthcheck:
      test: ["CMD", "python", "/app/sync/healthcheck.py"]
      interval: 60s
      timeout: 10s
      retries: 3
    # Measured on the 297-note vault (README "Resources"): peak 4,634 MiB, 3.97 cores.
    # Limit = peak + ~8 %; reservation = the 2.7 GiB model baseline + one batch. CPU is
    # capped at the VM's 4 cores so a sync cannot starve postgres and the API.
    deploy:
      resources:
        limits:
          memory: ${SYNC_MEM_LIMIT:-5g}
          cpus: "${SYNC_CPUS:-4}"
        reservations:
          memory: ${SYNC_MEM_RESERVATION:-3g}

volumes:
  pg_data:
  cognee_storage:
